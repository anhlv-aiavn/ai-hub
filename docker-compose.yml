name: ai-hub

# MinIO dùng kho có sẵn (storage.ai-hub.tumiki.org) — không chạy service minio ở đây.
# Model VLM dùng endpoint public — đặt VLLM_BASE_URL trong .env.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27018:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["56381:6379"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, redis]
    environment: &backend_env
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: aihub
      AIHUB_BUCKET: ${AIHUB_BUCKET:-ai-hub}
      ENDPOINT_URL_MINIO: ${ENDPOINT_URL_MINIO:-https://storage.ai-hub.tumiki.org}
      AWS_ACCESS_KEY_ID_MINIO: ${AWS_ACCESS_KEY_ID_MINIO:-minioadmin}
      AWS_SECRET_ACCESS_KEY_MINIO: ${AWS_SECRET_ACCESS_KEY_MINIO:-Tumiki2026}
      # Client MinIO pool sống lâu (PERF-1) + kill-switch. Xem docs/features_issues.md.
      AIHUB_S3_POOL: ${AIHUB_S3_POOL:-true}
      AIHUB_S3_POOL_MAX_CONNECTIONS: ${AIHUB_S3_POOL_MAX_CONNECTIONS:-128}
      # Đo thời gian từng chặng cho app.scripts.watch --timings (mặc định bật, chi phí ~0).
      AIHUB_TRACE_TIMINGS: ${AIHUB_TRACE_TIMINGS:-true}
      REDIS_URL: redis://redis:6379/0
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://14.232.240.254:30000/v1}
      # Nhiều máy vLLM: danh sách ngăn cách dấu phẩy, mỗi mục "url" hoặc "url|model|key".
      # Bỏ trống → chỉ dùng VLLM_BASE_URL (như cũ). Ví dụ 2 máy:
      #   VLLM_ENDPOINTS=http://192.168.120.9:30000/v1,http://192.168.120.10:30001/v1
      VLLM_ENDPOINTS: ${VLLM_ENDPOINTS:-}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME:-gemma-4-26B-A4B-NVFP4}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      ENABLE_THINKING: ${ENABLE_THINKING:-false}
      AIHUB_API_KEY: ${AIHUB_API_KEY:-}
      AIHUB_JWT_SECRET: ${AIHUB_JWT_SECRET:-}
      AIHUB_JWT_TTL_SECONDS: ${AIHUB_JWT_TTL_SECONDS:-604800}
      AIHUB_ADMIN_USER: ${AIHUB_ADMIN_USER:-}
      AIHUB_ADMIN_PASS: ${AIHUB_ADMIN_PASS:-}
      # Worker: in-flight batching cho vLLM + giới hạn trang
      MAX_VLM_CONCURRENT: ${MAX_VLM_CONCURRENT:-8}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-24}
      # Máy vLLM vừa lỗi kết nối → "làm nguội" N giây, né chọn lại (khỏi phí thử
      # máy chết mỗi request). 0 = tắt. Mọi máy nguội thì vẫn probe 1 máy.
      VLM_ENDPOINT_COOLDOWN_SECONDS: ${VLM_ENDPOINT_COOLDOWN_SECONDS:-15}
      # false = KHÔNG tạo file cắt per-GCN (bỏ tải ghi hàng loạt lên S3 đích).
      # Phân trang vẫn nằm trong extractions → cắt lại từ JSON khi cần.
      AIHUB_BUILD_CUTS: ${AIHUB_BUILD_CUTS:-true}
      AIHUB_MAX_PAGES: ${AIHUB_MAX_PAGES:-250}
      DETECT_WINDOW: ${DETECT_WINDOW:-12}
      DETECT_VERIFY: ${DETECT_VERIFY:-true}
      AIHUB_RENDER_DPI: ${AIHUB_RENDER_DPI:-200}
      AIHUB_RENDER_MAX_SIZE: ${AIHUB_RENDER_MAX_SIZE:-2000}
      AIHUB_RENDER_ORIENT: ${AIHUB_RENDER_ORIENT:-true}
      EXTRACT_TIMEOUT_SECONDS: ${EXTRACT_TIMEOUT_SECONDS:-3000}
      EXTRACT_RETRY_THINKING: ${EXTRACT_RETRY_THINKING:-false}
    ports: ["18002:8000"]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo, redis]
    environment: *backend_env
    command: ["python", "-m", "app.worker.main"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:80"]

volumes:
  mongo_data:
